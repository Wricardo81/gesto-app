<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitsAgenda OS</title>
    <meta name="theme-color" content="#0A192F">

    <style>
        :root {
            color-scheme: dark;
            --fundo: #0A192F;
            --destaque: #64FFDA;
            --texto: #FFFFFF;
            --texto-secundario: #8892B0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(100, 255, 218, 0.16), transparent 36%),
                linear-gradient(145deg, #0A192F, #111827);
            color: var(--texto);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(420px, 100%);
            padding: 28px;
            border-radius: 24px;
            border: 1px solid rgba(100, 255, 218, 0.22);
            background: rgba(15, 23, 42, 0.74);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
            text-align: center;
        }

        span {
            display: inline-block;
            color: var(--destaque);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        p {
            margin: 0;
            color: var(--texto-secundario);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main>
        <span>BitsAgenda OS</span>
        <h1>Abrindo seu painel...</h1>
        <p>Estamos preparando a melhor tela para continuar seu atendimento.</p>
    </main>

    <script>
        (function iniciarAppPwa() {
            const parametros = new URLSearchParams(window.location.search);
            const tenantUrl = parametros.get("tenant");

            const possiveisChavesTenant = [
                "tenant_slug",
                "tenantSlug",
                "tenant",
                "tenant_id",
                "bitsagenda_tenant",
                "bitsagenda_tenant_slug",
                "bitsagenda_tenant_id",
                "tenantSlugLogado"
            ];

            function obterTenantSalvo() {
                if (tenantUrl) {
                    return tenantUrl;
                }

                for (const chave of possiveisChavesTenant) {
                    const valor = localStorage.getItem(chave);

                    if (valor && valor !== "null" && valor !== "undefined") {
                        return valor;
                    }
                }

                for (let indice = 0; indice < localStorage.length; indice += 1) {
                    const chave = localStorage.key(indice);
                    const valor = localStorage.getItem(chave) || "";

                    if (
                        chave
                        && chave.toLowerCase().includes("tenant")
                        && valor
                        && valor.length < 80
                    ) {
                        return valor;
                    }
                }

                return "";
            }

            const tenant = obterTenantSalvo();

            if (tenant) {
                window.location.replace(`./admin.html?tenant=${encodeURIComponent(tenant)}`);
                return;
            }

            window.location.replace("./index.html");
        })();
    </script>
</body>
</html>
